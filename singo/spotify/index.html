<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Singo · Spotify</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16120E; color: #F2E8D7; font: 18px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 26em; padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 40px; }
    a { display: inline-block; margin-top: 8px; padding: 12px 18px; border-radius: 14px; background: #E7AE34; color: #1C1712; font-weight: 700; text-decoration: none; }
    .muted { color: #A99B87; }
  </style>
</head>
<body>
  <main>
    <h1>Singo</h1>
    <p id="msg">Taking you back to Singo…</p>
    <a id="back" hidden>Back to Singo</a>
  </main>
  <script>
    // Spotify only sends a login to an https address (or to 127.0.0.1), so a
    // phone that connects Spotify for Singo on a TV lands here first. This page
    // forwards the login to the Singo server on the local network, whose address
    // is in `state`. The code is useless on its own: only the TV holds the PKCE
    // verifier needed to turn it into a login.
    (function () {
      var q = new URLSearchParams(location.search), origin = null;
      try { origin = JSON.parse(atob(q.get('state').replace(/-/g, '+').replace(/_/g, '/'))).o; } catch (e) {}
      // Only private network addresses, so this page can't be used to send people elsewhere.
      var lan = /^http:\/\/(10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2})(:\d{1,5})?$/;
      var msg = document.getElementById('msg');
      if (!origin || !lan.test(origin)) {
        msg.textContent = 'This page finishes a Spotify login for Singo, but this link is incomplete. Scan the code on the TV again.';
        return;
      }
      var url = origin + '/spotify' + location.search;
      var back = document.getElementById('back');
      back.href = url;
      back.hidden = false;
      msg.innerHTML = 'Taking you back to Singo… <span class="muted">If nothing happens, tap the button. Your phone must be on the same Wi-Fi as the TV.</span>';
      location.replace(url);
    })();
  </script>
</body>
</html>
